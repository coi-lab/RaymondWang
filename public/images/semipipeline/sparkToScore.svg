<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">PySpark to model risk score pipeline</title>
  <desc id="desc">Raw SECOM files flow through PySpark cleaning to a saved model and wafer risk scores.</desc>
  <rect width="900" height="675" fill="#f7f5f2"/>
  <text x="55" y="70" fill="#35224f" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">DISTRIBUTED CLEANUP → MODEL SCORE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="140" width="210" height="130" rx="10" fill="#35224f"/>
    <text x="160" y="190" fill="#fff" font-size="21" font-weight="700">RAW FILES</text>
    <text x="160" y="222" fill="#dcd0e8" font-size="15">sensor + labels</text>
    <text x="160" y="246" fill="#dcd0e8" font-size="15">1,567 × 592</text>
    <rect x="345" y="140" width="210" height="130" rx="10" fill="#6d43a3"/>
    <text x="450" y="190" fill="#fff" font-size="21" font-weight="700">PYSPARK</text>
    <text x="450" y="222" fill="#eee8f3" font-size="15">audit + cleanup</text>
    <text x="450" y="246" fill="#eee8f3" font-size="15">remove 144 columns</text>
    <rect x="635" y="140" width="210" height="130" rx="10" fill="#d36b67"/>
    <text x="740" y="190" fill="#fff" font-size="21" font-weight="700">CLEAN DATA</text>
    <text x="740" y="222" fill="#fff" font-size="15">matches pandas</text>
    <text x="740" y="246" fill="#fff" font-size="15">1,567 × 448</text>
    <path d="M265 205h80M555 205h80" stroke="#a98acb" stroke-width="6"/>
    <path d="M333 194l15 11-15 11M623 194l15 11-15 11" fill="none" stroke="#a98acb" stroke-width="6"/>
    <path d="M740 270v89H450v39" fill="none" stroke="#a98acb" stroke-width="6"/>
    <path d="M439 386l11 15 11-15" fill="none" stroke="#a98acb" stroke-width="6"/>
    <rect x="270" y="402" width="360" height="105" rx="10" fill="#35224f"/>
    <text x="450" y="445" fill="#fff" font-size="20" font-weight="700">SAVED SCIKIT-LEARN PIPELINE</text>
    <text x="450" y="478" fill="#dcd0e8" font-size="15">impute → scale → select → XGBoost</text>
    <path d="M450 507v55" stroke="#a98acb" stroke-width="6"/>
    <path d="M439 550l11 15 11-15" fill="none" stroke="#a98acb" stroke-width="6"/>
    <rect x="270" y="566" width="360" height="65" rx="10" fill="#d36b67"/>
    <text x="450" y="607" fill="#fff" font-size="20" font-weight="700">WAFER ML RISK SCORE</text>
  </g>
</svg>
