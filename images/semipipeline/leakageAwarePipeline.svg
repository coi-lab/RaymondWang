<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Leakage-aware machine learning pipeline</title>
  <desc id="desc">Data splits before preprocessing so only training data fits the imputer, scaler, selector, and XGBoost model.</desc>
  <rect width="900" height="675" fill="#35224f"/>
  <text x="55" y="68" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">SPLIT BEFORE LEARNING</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="115" width="190" height="74" rx="8" fill="#f6f1e8"/>
    <text x="150" y="147" fill="#35224f" font-size="19" font-weight="700" text-anchor="middle">RAW SECOM</text>
    <text x="150" y="173" fill="#6b6570" font-size="15" text-anchor="middle">1,567 × 592</text>
    <path d="M245 152h73" stroke="#a98acb" stroke-width="5"/>
    <path d="M310 143l13 9-13 9" fill="none" stroke="#a98acb" stroke-width="5"/>
    <rect x="325" y="115" width="190" height="74" rx="8" fill="#dcd0e8"/>
    <text x="420" y="147" fill="#35224f" font-size="19" font-weight="700" text-anchor="middle">COLUMN AUDIT</text>
    <text x="420" y="173" fill="#6b6570" font-size="15" text-anchor="middle">remove 144</text>
    <path d="M515 152h73" stroke="#a98acb" stroke-width="5"/>
    <path d="M580 143l13 9-13 9" fill="none" stroke="#a98acb" stroke-width="5"/>
    <rect x="595" y="115" width="250" height="74" rx="8" fill="#f6f1e8"/>
    <text x="720" y="147" fill="#35224f" font-size="19" font-weight="700" text-anchor="middle">TRAIN / VAL / TEST</text>
    <text x="720" y="173" fill="#6b6570" font-size="15" text-anchor="middle">split first</text>
    <path d="M720 189v68H250v45" fill="none" stroke="#a98acb" stroke-width="5"/>
    <path d="M241 294l9 13 9-13" fill="none" stroke="#a98acb" stroke-width="5"/>
    <text x="488" y="243" fill="#e9deef" font-size="15" text-anchor="middle">ONLY TRAINING DATA FITS THESE STEPS</text>
    <g text-anchor="middle">
      <rect x="55" y="307" width="180" height="90" rx="8" fill="#6d43a3" stroke="#a98acb" stroke-width="2"/>
      <text x="145" y="346" fill="#fff" font-size="18" font-weight="700">KNN IMPUTER</text>
      <text x="145" y="373" fill="#e9deef" font-size="14">fill missing values</text>
      <rect x="265" y="307" width="180" height="90" rx="8" fill="#6d43a3" stroke="#a98acb" stroke-width="2"/>
      <text x="355" y="346" fill="#fff" font-size="18" font-weight="700">MINMAX</text>
      <text x="355" y="373" fill="#e9deef" font-size="14">scale sensors</text>
      <rect x="475" y="307" width="180" height="90" rx="8" fill="#6d43a3" stroke="#a98acb" stroke-width="2"/>
      <text x="565" y="346" fill="#fff" font-size="18" font-weight="700">SELECTOR</text>
      <text x="565" y="373" fill="#e9deef" font-size="14">keep 20 sensors</text>
      <rect x="685" y="307" width="160" height="90" rx="8" fill="#d36b67"/>
      <text x="765" y="346" fill="#fff" font-size="18" font-weight="700">XGBOOST</text>
      <text x="765" y="373" fill="#fff" font-size="14">class weighted</text>
    </g>
    <path d="M235 352h30M445 352h30M655 352h30" stroke="#f6f1e8" stroke-width="4"/>
    <path d="M765 397v70" stroke="#a98acb" stroke-width="5"/>
    <path d="M756 459l9 13 9-13" fill="none" stroke="#a98acb" stroke-width="5"/>
    <rect x="530" y="474" width="315" height="100" rx="8" fill="#f6f1e8"/>
    <text x="687" y="514" fill="#35224f" font-size="20" font-weight="700" text-anchor="middle">VALIDATION THRESHOLD</text>
    <text x="687" y="544" fill="#6b6570" font-size="16" text-anchor="middle">0.0792 → isolated test set</text>
    <text x="55" y="620" fill="#e9deef" font-size="17">Saved together as secom_xgboost_production_v1.pkl</text>
  </g>
</svg>
